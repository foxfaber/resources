<figure>
      
        <svg viewBox="0 0 640 310" role="img" aria-label="Vista esplosa del giunto: il tenone sulla traversa entra nella mortasa del montante; sono indicate spalla, guancia, testa, pareti e fondo della mortasa.">
          <defs>
            <marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
            </marker>
            <pattern id="htch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
              <line x1="0" y1="0" x2="0" y2="7" stroke="currentColor" stroke-width="1" opacity=".45"/>
            </pattern>
          </defs>
          <!-- traversa con tenone -->
          <rect x="30" y="120" width="250" height="90" fill="none" stroke="currentColor" stroke-width="2"/>
          <rect x="280" y="150" width="78" height="30" fill="url(#htch)" stroke="currentColor" stroke-width="2"/>
          <line x1="280" y1="120" x2="280" y2="150" stroke="currentColor" stroke-width="2"/>
          <line x1="280" y1="180" x2="280" y2="210" stroke="currentColor" stroke-width="2"/>
          <text x="40" y="112" font-size="12" fill="currentColor" font-family="monospace">TRAVERSA</text>
          <!-- etichette traversa -->
          <line x1="268" y1="247" x2="279" y2="214" stroke="currentColor" stroke-width="1" marker-end="url(#fr)"/>
          <text x="214" y="261" font-size="12" fill="currentColor" font-family="monospace">spalla</text>
          <line x1="316" y1="128" x2="316" y2="146" stroke="currentColor" stroke-width="1" marker-end="url(#fr)"/>
          <text x="296" y="120" font-size="12" fill="currentColor" font-family="monospace">guancia</text>
          <line x1="383" y1="196" x2="360" y2="178" stroke="currentColor" stroke-width="1" marker-end="url(#fr)"/>
          <text x="370" y="212" font-size="12" fill="currentColor" font-family="monospace">testa</text>
          <!-- montante con mortasa -->
          <rect x="470" y="30" width="110" height="250" fill="none" stroke="currentColor" stroke-width="2"/>
          <rect x="470" y="150" width="72" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/>
          <line x1="470" y1="150" x2="470" y2="180" stroke="var(--carta-2)" stroke-width="4"/>
          <line x1="470" y1="150" x2="470" y2="180" stroke="currentColor" stroke-width="2"/>
          <text x="480" y="22" font-size="12" fill="currentColor" font-family="monospace">MONTANTE</text>
          <line x1="604" y1="120" x2="556" y2="152" stroke="currentColor" stroke-width="1" marker-end="url(#fr)"/>
          <text x="560" y="112" font-size="12" fill="currentColor" font-family="monospace">fondo</text>
          <line x1="522" y1="110" x2="508" y2="147" stroke="currentColor" stroke-width="1" marker-end="url(#fr)"/>
          <text x="492" y="102" font-size="12" fill="currentColor" font-family="monospace">parete</text>
          <text x="506" y="74" font-size="12" fill="currentColor" font-family="monospace">corno</text>
          <!-- freccia di inserimento -->
          <line x1="372" y1="165" x2="458" y2="165" stroke="var(--mina)" stroke-width="2" marker-end="url(#fr)"/>
          <text x="382" y="157" font-size="12" fill="var(--mina)" font-family="monospace">inserimento</text>
        </svg>
      
<figcaption><b>Fig. 7.1</b> — Le due superfici tratteggiate (guance) sono le sole che incollano: 2 × 30 × 78 mm di legno di filo contro legno di filo. Le spalle chiudono la vista; la testa non incolla mai, perché è legno di testa.</figcaption>
    </figure>
