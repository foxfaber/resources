<figure>
<svg viewBox="0 0 600 210" role="img" aria-label="Tracciatura del mezzo legno: il truschino si regola a metà spessore e si traccia dalle due facce; se le linee non coincidono si corregge di metà differenza.">
  <defs><marker id="f82" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--mina)"/></marker></defs>
  <rect x="40" y="60" width="220" height="70" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="40" y1="92" x2="260" y2="92" stroke="var(--mina)" stroke-width="2"/>
  <line x1="40" y1="100" x2="260" y2="100" stroke="currentColor" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="40" y="50" font-size="12">tracciato dalla faccia A</text>
  <text x="40" y="150" font-size="12">tracciato dalla faccia B</text>
  <line x1="286" y1="92" x2="286" y2="100" stroke="var(--mina)" stroke-width="2" marker-start="url(#f82)" marker-end="url(#f82)"/>
  <text x="296" y="100" font-size="12" fill="var(--mina)">differenza = 2 × errore</text>
  <text x="296" y="124" font-size="12">si sposta il truschino di metà</text>
  <text x="296" y="142" font-size="12">e si ritraccia: due tentativi bastano</text>
  <rect x="40" y="168" width="220" height="26" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="40" y1="181" x2="260" y2="181" stroke="var(--mina)" stroke-width="2"/>
  <text x="296" y="186" font-size="12" fill="var(--mina)">le due linee coincidono: è la metà esatta</text>
  <text x="40" y="208" font-size="12">il metodo trova il centro senza misurare lo spessore</text>
</svg>
<figcaption><b>Fig. 8.2</b> — Non serve sapere se il pezzo è spesso 19,6 o 20,2 mm: tracciando dalle due facce l'errore si raddoppia e si vede. Due correzioni da metà differenza e il truschino è esattamente a metà.</figcaption>
