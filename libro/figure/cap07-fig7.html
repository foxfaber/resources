<figure>
          
            <svg viewBox="0 0 600 240" role="img" aria-label="Telaio in morsetti: la pressione passa in linea con le traverse e si verifica la squadratura misurando le due diagonali, che devono essere uguali.">
              <rect x="110" y="40" width="380" height="160" fill="none" stroke="currentColor" stroke-width="2"/>
              <rect x="110" y="40" width="40" height="160" fill="url(#htch)" stroke="currentColor" stroke-width="2"/>
              <rect x="450" y="40" width="40" height="160" fill="url(#htch)" stroke="currentColor" stroke-width="2"/>
              <!-- diagonali -->
              <line x1="150" y1="40" x2="450" y2="200" stroke="var(--mina)" stroke-width="1.5" stroke-dasharray="7 5"/>
              <line x1="150" y1="200" x2="450" y2="40" stroke="var(--mina)" stroke-width="1.5" stroke-dasharray="7 5"/>
              <text x="230" y="96" font-size="12" fill="var(--mina)" font-family="monospace">D1</text>
              <text x="348" y="96" font-size="12" fill="var(--mina)" font-family="monospace">D2</text>
              <text x="222" y="228" font-size="12" fill="var(--mina)" font-family="monospace">D1 = D2 ± 1 mm</text>
              <!-- morsetti -->
              <line x1="40" y1="70" x2="104" y2="70" stroke="currentColor" stroke-width="2" marker-end="url(#fr)"/>
              <line x1="560" y1="70" x2="496" y2="70" stroke="currentColor" stroke-width="2" marker-end="url(#fr)"/>
              <line x1="40" y1="170" x2="104" y2="170" stroke="currentColor" stroke-width="2" marker-end="url(#fr)"/>
              <line x1="560" y1="170" x2="496" y2="170" stroke="currentColor" stroke-width="2" marker-end="url(#fr)"/>
              <text x="24" y="30" font-size="12" fill="currentColor" font-family="monospace">pressione in asse con le traverse</text>
            </svg>
          <figcaption><b>Fig. 7.7</b> — Se le diagonali differiscono, si sposta un morsetto di qualche grado verso la diagonale lunga: il telaio rientra in squadra finché la colla è fresca, cioè entro i primi dieci minuti.</figcaption>
        </figure>
