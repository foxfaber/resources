<figure>
<svg viewBox="0 0 600 220" role="img" aria-label="Le tre lavorazioni a confronto in sezione: scanalatura nel verso della fibra, incastro a dado di traverso e battuta sullo spigolo.">
  <defs><marker id="f101" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  <pattern id="h101" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="currentColor" stroke-width="1" opacity=".4"/></pattern></defs>
  <g>
    <text x="30" y="26" font-size="12">scanalatura</text>
    <path d="M30,60 L170,60 L170,120 L30,120 z" fill="url(#h101)" stroke="currentColor" stroke-width="2"/>
    <path d="M78,60 L78,96 L110,96 L110,60" fill="#fff" stroke="currentColor" stroke-width="2"/>
    <path d="M40,130 q40,-8 80,0 M40,142 q40,-8 80,0" fill="none" stroke="currentColor" stroke-width="1" opacity=".6"/>
    <text x="30" y="166" font-size="12">nel verso della fibra</text>
    <text x="30" y="184" font-size="12">pannelli, fondi, ante</text>
  </g>
  <g>
    <text x="230" y="26" font-size="12">incastro a dado</text>
    <path d="M230,60 L370,60 L370,120 L230,120 z" fill="url(#h101)" stroke="currentColor" stroke-width="2"/>
    <path d="M278,60 L278,96 L310,96 L310,60" fill="#fff" stroke="currentColor" stroke-width="2"/>
    <g stroke="currentColor" stroke-width="1" opacity=".6">
      <line x1="240" y1="128" x2="240" y2="146"/><line x1="260" y1="128" x2="260" y2="146"/><line x1="280" y1="128" x2="280" y2="146"/><line x1="300" y1="128" x2="300" y2="146"/>
    </g>
    <text x="230" y="166" font-size="12">di traverso alla fibra</text>
    <text x="230" y="184" font-size="12">ripiani, divisori</text>
  </g>
  <g>
    <text x="430" y="26" font-size="12">battuta</text>
    <path d="M430,60 L570,60 L570,120 L430,120 z" fill="url(#h101)" stroke="currentColor" stroke-width="2"/>
    <path d="M530,60 L530,92 L570,92" fill="#fff" stroke="currentColor" stroke-width="2"/>
    <line x1="530" y1="60" x2="570" y2="60" stroke="#fff" stroke-width="3"/>
    <path d="M530,60 L530,92 L570,92" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="430" y="166" font-size="12">sullo spigolo</text>
    <text x="430" y="184" font-size="12">schienali, fondi, vetri</text>
  </g>
  <text x="30" y="212" font-size="12" fill="var(--mina)">tutte e tre hanno la stessa funzione: dare al pezzo una sede e lasciarlo libero di muoversi dentro</text>
</svg>
<figcaption><b>Fig. 10.1</b> — Scanalatura e dado si distinguono per la direzione rispetto alla fibra, e questo cambia tutto: la prima si esegue facilmente, il secondo taglia le fibre di traverso e va inciso prima di essere scavato.</figcaption>
</figure>
