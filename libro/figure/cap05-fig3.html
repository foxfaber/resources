<figure>
<svg viewBox="0 0 600 220" role="img" aria-label="Correzione del taglio: se la lama esce dalla linea si ruota leggermente la sega per rientrare in diverse passate, invece di forzarla di lato.">
  <defs><marker id="f53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--mina)"/></marker></defs>
  <text x="30" y="26" font-size="12">sbagliato: forzare di lato</text>
  <rect x="30" y="50" width="230" height="110" fill="url(#h51)" stroke="currentColor" stroke-width="2"/>
  <line x1="145" y1="50" x2="145" y2="160" stroke="var(--mina)" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M145,50 L160,110 L158,160" fill="none" stroke="currentColor" stroke-width="4"/>
  <line x1="190" y1="110" x2="166" y2="110" stroke="var(--avviso)" stroke-width="2" marker-end="url(#f53)"/>
  <text x="34" y="182" font-size="12">la lama si piega, il taglio si allarga</text>
  <text x="34" y="200" font-size="12">e il bordo esce ondulato</text>
  <text x="330" y="26" font-size="12" fill="var(--mina)">giusto: ruotare e rientrare piano</text>
  <rect x="330" y="50" width="240" height="110" fill="url(#h51)" stroke="currentColor" stroke-width="2"/>
  <line x1="445" y1="50" x2="445" y2="160" stroke="var(--mina)" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M445,50 L458,96 L452,128 L445,160" fill="none" stroke="currentColor" stroke-width="4"/>
  <path d="M478,96 q14,20 0,38" fill="none" stroke="var(--mina)" stroke-width="2" marker-end="url(#f53)"/>
  <text x="334" y="182" font-size="12">si inclina la lama di pochi gradi verso la linea</text>
  <text x="334" y="200" font-size="12">e si lascia che rientri in cinque o sei passate</text>
</svg>
<figcaption><b>Fig. 5.3</b> — Una lama forzata di lato scalda, si incastra e lascia una parete concava. Una lama inclinata di due gradi taglia più materiale da un lato e rientra da sola: è l'unico modo per salvare un taglio partito storto.</figcaption>
</figure>
