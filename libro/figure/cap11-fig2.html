<figure>
<svg viewBox="0 0 600 200" role="img" aria-label="Quantità di colla: troppo poca lascia zone asciutte, giusta forma una linea sottile continua, troppa spreme via e sporca senza aggiungere tenuta.">
  <defs><marker id="f112" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--mina)"/></marker></defs>
  <g>
    <text x="30" y="26" font-size="12" fill="var(--avviso)">poca</text>
    <rect x="30" y="46" width="150" height="26" fill="url(#h111)" stroke="currentColor" stroke-width="2"/>
    <rect x="30" y="80" width="150" height="26" fill="url(#h111)" stroke="currentColor" stroke-width="2"/>
    <g stroke="var(--mina)" stroke-width="3">
      <line x1="40" y1="76" x2="70" y2="76"/><line x1="110" y1="76" x2="130" y2="76"/>
    </g>
    <text x="30" y="128" font-size="12">zone asciutte: il giunto</text>
    <text x="30" y="146" font-size="12">cede dove manca colla</text>
  </g>
  <g>
    <text x="225" y="26" font-size="12" fill="var(--mina)">giusta</text>
    <rect x="225" y="46" width="150" height="26" fill="url(#h111)" stroke="currentColor" stroke-width="2"/>
    <rect x="225" y="80" width="150" height="26" fill="url(#h111)" stroke="currentColor" stroke-width="2"/>
    <line x1="225" y1="76" x2="375" y2="76" stroke="var(--mina)" stroke-width="3"/>
    <circle cx="240" cy="72" r="3" fill="var(--mina)"/><circle cx="300" cy="72" r="3" fill="var(--mina)"/><circle cx="360" cy="72" r="3" fill="var(--mina)"/>
    <text x="225" y="128" font-size="12">linea continua e piccole</text>
    <text x="225" y="146" font-size="12">gocce uniformi tutt'attorno</text>
  </g>
  <g>
    <text x="420" y="26" font-size="12" fill="var(--avviso)">troppa</text>
    <rect x="420" y="46" width="150" height="26" fill="url(#h111)" stroke="currentColor" stroke-width="2"/>
    <rect x="420" y="80" width="150" height="26" fill="url(#h111)" stroke="currentColor" stroke-width="2"/>
    <line x1="420" y1="76" x2="570" y2="76" stroke="var(--mina)" stroke-width="3"/>
    <path d="M430,72 q-8,-10 -14,-16 M470,72 q-6,-12 -10,-20 M540,72 q8,-10 14,-18" stroke="var(--mina)" stroke-width="3" fill="none"/>
    <text x="420" y="128" font-size="12">cola sulle facce, penetra</text>
    <text x="420" y="146" font-size="12">nei pori e blocca la finitura</text>
  </g>
  <text x="30" y="180" font-size="12">la tenuta non cresce con la quantità: cresce con il contatto fra le superfici</text>
</svg>
<figcaption><b>Fig. 11.2</b> — Il collante lavora in uno strato di pochi centesimi. Tutto quello che esce è colla che non tiene nulla e che, finita nei pori del legno, si vedrà come una macchia chiara sotto la finitura.</figcaption>
</figure>
