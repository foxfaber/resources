<figcaption><b>Fig. 12.4</b> — Ogni difetto di chiusura si corregge con spessori sotto le foglie, un decimo per volta. Allargare le viti o riempire con stucco risolve per una settimana e poi lascia l'anta ballerina.</figcaption>
