<figure>
<svg viewBox="0 0 600 230" role="img" aria-label="Verso della fibra: piallando nel verso del pelo il truciolo si stacca pulito, contro pelo le fibre si sollevano e si strappano; sotto, la pressione sulla pialla all'inizio e alla fine della passata.">
  <defs><marker id="f64" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--mina)"/></marker></defs>
  <rect x="30" y="46" width="240" height="46" fill="none" stroke="currentColor" stroke-width="2"/>
  <path d="M30,88 L90,46 M70,88 L130,46 M110,88 L170,46 M150,88 L210,46 M190,88 L250,46" stroke="currentColor" stroke-width="1" opacity=".6"/>
  <line x1="250" y1="34" x2="150" y2="34" stroke="var(--mina)" stroke-width="2" marker-end="url(#f64)"/>
  <text x="30" y="30" font-size="12" fill="var(--mina)">nel verso del pelo: truciolo intero</text>
  <text x="30" y="110" font-size="12">la lama entra sotto le fibre e le solleva dolcemente</text>
  <rect x="330" y="46" width="240" height="46" fill="none" stroke="currentColor" stroke-width="2"/>
  <path d="M330,88 L390,46 M370,88 L430,46 M410,88 L470,46 M450,88 L510,46 M490,88 L550,46" stroke="currentColor" stroke-width="1" opacity=".6"/>
  <line x1="350" y1="34" x2="450" y2="34" stroke="var(--avviso)" stroke-width="2" marker-end="url(#f64)"/>
  <text x="330" y="30" font-size="12" fill="var(--avviso)">contro pelo: strappo</text>
  <text x="330" y="110" font-size="12">la lama solleva la fibra e la spezza sotto la superficie</text>
  <line x1="40" y1="178" x2="560" y2="178" stroke="currentColor" stroke-width="2"/>
  <rect x="70" y="156" width="90" height="22" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="78" y1="148" x2="78" y2="156" stroke="var(--mina)" stroke-width="3" marker-start="url(#f64)"/>
  <text x="46" y="140" font-size="12" fill="var(--mina)">inizio: peso sul pomolo</text>
  <rect x="300" y="156" width="90" height="22" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="382" y1="148" x2="382" y2="156" stroke="var(--mina)" stroke-width="3" marker-start="url(#f64)"/>
  <text x="330" y="140" font-size="12" fill="var(--mina)">fine: peso sul manico</text>
  <text x="40" y="204" font-size="12">se la pressione non si sposta, il pezzo esce convesso: si scava all'inizio e alla fine</text>
  <text x="40" y="222" font-size="12">le passate si sovrappongono per metà larghezza, mai affiancate</text>
</svg>
<figcaption><b>Fig. 6.4</b> — Il verso si legge dal fianco del pezzo: le fibre salgono verso la superficie come tegole, e la pialla deve risalirle, mai infilarsi sotto. Se non si capisce, si prova con due passate leggere in un verso e due nell'altro.</figcaption>
</figure>
