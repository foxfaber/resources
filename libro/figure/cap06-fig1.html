<figure>
<svg viewBox="0 0 600 230" role="img" aria-label="Sequenza delle quattro superfici: prima una faccia piana, poi un filo a squadra, poi la larghezza con il truschino e infine lo spessore.">
  <defs><marker id="f61" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--mina)"/></marker>
  <pattern id="h61" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="currentColor" stroke-width="1" opacity=".4"/></pattern></defs>
  <g>
    <rect x="30" y="60" width="110" height="60" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="30" y1="60" x2="140" y2="60" stroke="var(--mina)" stroke-width="4"/>
    <text x="30" y="46" font-size="12">1 · faccia piana</text>
    <path d="M62,80 q12,-10 24,0 q12,10 24,0" fill="none" stroke="var(--mina)" stroke-width="2"/>
    <text x="30" y="142" font-size="12">riga e stecche</text>
    <text x="30" y="158" font-size="12">di riscontro</text>
  </g>
  <g>
    <rect x="175" y="60" width="110" height="60" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="175" y1="60" x2="285" y2="60" stroke="var(--mina)" stroke-width="4"/>
    <line x1="175" y1="60" x2="175" y2="120" stroke="var(--mina)" stroke-width="4"/>
    <text x="175" y="46" font-size="12">2 · filo a squadra</text>
    <path d="M186,70 l0,14 l14,0" fill="none" stroke="var(--mina)" stroke-width="2"/>
    <text x="175" y="142" font-size="12">squadra appoggiata</text>
    <text x="175" y="158" font-size="12">sulla faccia 1</text>
  </g>
  <g>
    <rect x="320" y="60" width="110" height="60" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="320" y1="60" x2="430" y2="60" stroke="var(--mina)" stroke-width="4"/>

  </g>
  <g>
    <rect x="465" y="60" width="110" height="60" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="465" y1="60" x2="575" y2="60" stroke="var(--mina)" stroke-width="4"/>

    <text x="465" y="142" font-size="12">truschino dalla faccia 1,</text>

  <line x1="148" y1="90" x2="168" y2="90" stroke="var(--mina)" stroke-width="2" marker-end="url(#f61)"/>
