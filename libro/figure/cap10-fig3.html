<figure>
<svg viewBox="0 0 600 230" role="img" aria-label="Esecuzione dell'incastro a dado: incisione delle due linee, tagli di delimitazione con guida, asportazione a scalpello e controllo del fondo.">
  <defs><marker id="f103" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--mina)"/></marker></defs>
  <text x="30" y="26" font-size="12">1 · incidere le due linee col coltello</text>
  <rect x="30" y="40" width="240" height="56" fill="url(#h101)" stroke="currentColor" stroke-width="2"/>
  <line x1="120" y1="40" x2="120" y2="96" stroke="var(--mina)" stroke-width="2"/>
  <line x1="180" y1="40" x2="180" y2="96" stroke="var(--mina)" stroke-width="2"/>
  <text x="330" y="26" font-size="12">2 · segare con guida avvitata</text>
  <rect x="330" y="40" width="240" height="56" fill="url(#h101)" stroke="currentColor" stroke-width="2"/>
  <rect x="330" y="24" width="90" height="12" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="420" y1="30" x2="420" y2="80" stroke="currentColor" stroke-width="3"/>
  <line x1="480" y1="40" x2="480" y2="80" stroke="var(--mina)" stroke-width="2"/>
  <text x="330" y="116" font-size="12">la guida è il riferimento, non la linea</text>
  <text x="30" y="150" font-size="12">3 · asportare a scalpello dai due lati</text>
  <rect x="30" y="164" width="240" height="56" fill="url(#h101)" stroke="currentColor" stroke-width="2"/>
  <path d="M120,164 L120,196 L180,196 L180,164" fill="#fff" stroke="currentColor" stroke-width="2"/>
  <line x1="96" y1="196" x2="132" y2="196" stroke="var(--mina)" stroke-width="2" marker-end="url(#f103)"/>
  <line x1="204" y1="196" x2="168" y2="196" stroke="var(--mina)" stroke-width="2" marker-end="url(#f103)"/>
  <text x="330" y="150" font-size="12">4 · controllo del fondo</text>
  <rect x="330" y="164" width="240" height="56" fill="url(#h101)" stroke="currentColor" stroke-width="2"/>
  <path d="M420,164 L420,196 L480,196 L480,164" fill="#fff" stroke="currentColor" stroke-width="2"/>
  <rect x="414" y="190" width="72" height="6" fill="none" stroke="var(--mina)" stroke-width="2"/>
  <text x="330" y="116" font-size="12"> </text>
  <text x="494" y="196" font-size="12" fill="var(--mina)">riga corta</text>
  <text x="30" y="116" font-size="12">l'incisione impedisce alle fibre di strapparsi</text>
</svg>
<figcaption><b>Fig. 10.3</b> — Nel dado si taglia di traverso alla fibra: senza le due incisioni di coltello il bordo si sfalda e la luce resta in vista per sempre, perché è proprio il bordo del dado a chiudere la giunzione.</figcaption>
</figure>
