<figure>
<svg viewBox="0 0 600 200" role="img" aria-label="La bava: il filo si rovescia sul dorso quando il bisello è arrivato a fondo; si controlla con il polpastrello e si elimina sulla pietra fine.">
  <defs><marker id="f42" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--mina)"/></marker></defs>
  <text x="30" y="28" font-size="12">1 · la bava si forma su tutta la larghezza</text>
  <path d="M30,60 L250,60 L250,96 L80,96 z" fill="url(#h41)" stroke="currentColor" stroke-width="2"/>
  <path d="M30,60 q-10,-8 -16,-16" fill="none" stroke="var(--mina)" stroke-width="3"/>
  <text x="34" y="46" font-size="12" fill="var(--mina)">bava rovesciata sul dorso</text>
  <text x="30" y="124" font-size="12">si sente con il polpastrello tirato dal dorso verso il filo</text>
  <text x="30" y="146" font-size="12">se manca in un punto, il bisello non è ancora arrivato lì</text>
  <text x="330" y="28" font-size="12">2 · si elimina, non si piega</text>
  <path d="M330,60 L560,60 L560,96 L380,96 z" fill="url(#h41)" stroke="currentColor" stroke-width="2"/>
  <line x1="330" y1="60" x2="560" y2="60" stroke="var(--mina)" stroke-width="3"/>
  <line x1="420" y1="44" x2="340" y2="44" stroke="var(--mina)" stroke-width="2" marker-end="url(#f42)"/>
  <text x="430" y="48" font-size="12" fill="var(--mina)">dorso sulla pietra fine</text>
  <text x="330" y="124" font-size="12">alternare due passate di dorso e due di bisello</text>
  <text x="330" y="146" font-size="12">finché il polpastrello non sente più nulla</text>
  <text x="30" y="182" font-size="12">prova finale: il filo taglia un foglio di carta tenuto in aria, senza strapparlo</text>
</svg>
<figcaption><b>Fig. 4.3</b> — La bava è l'unico segnale oggettivo che il bisello ha raggiunto il tagliente su tutta la larghezza. Un filo affilato "a occhio" senza bava è quasi sempre un filo arrotondato.</figcaption>
</figure>
