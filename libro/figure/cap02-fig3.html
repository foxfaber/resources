<figure>
<svg viewBox="0 0 600 200" role="img" aria-label="I tre modi di fermare un pezzo: contro il fermo per piallare, in morsa verticale per segare, contro un fermo a elle per scalpellare.">
  <defs><marker id="f22" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--mina)"/></marker></defs>
  <g>
    <text x="20" y="28" font-size="12">1 · piallare</text>
    <rect x="20" y="96" width="160" height="14" fill="url(#h21)" stroke="currentColor" stroke-width="2"/>
    <rect x="30" y="76" width="130" height="20" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="20" y="70" width="10" height="26" fill="var(--mina)" opacity=".55" stroke="var(--mina)" stroke-width="1.5"/>
    <line x1="176" y1="86" x2="40" y2="86" stroke="var(--mina)" stroke-width="2" marker-end="url(#f22)"/>
    <text x="20" y="134" font-size="12">la spinta va contro</text><text x="20" y="150" font-size="12">il fermo: niente morse</text>
  </g>
  <g>
    <text x="220" y="28" font-size="12">2 · segare</text>
    <rect x="220" y="96" width="140" height="14" fill="url(#h21)" stroke="currentColor" stroke-width="2"/>
    <rect x="252" y="40" width="22" height="58" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="238" y="56" width="14" height="42" fill="var(--mina)" opacity=".45" stroke="var(--mina)" stroke-width="1.5"/>
    <line x1="296" y1="46" x2="264" y2="92" stroke="currentColor" stroke-width="2"/>
    <text x="220" y="134" font-size="12">pezzo basso in morsa:</text><text x="220" y="150" font-size="12">meno vibrazione</text>
  </g>
  <g>
    <text x="420" y="28" font-size="12">3 · scalpellare</text>
    <rect x="420" y="96" width="160" height="14" fill="url(#h21)" stroke="currentColor" stroke-width="2"/>
    <rect x="440" y="76" width="120" height="20" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="430" y="70" width="10" height="26" fill="var(--mina)" opacity=".55" stroke="var(--mina)" stroke-width="1.5"/>
    <rect x="470" y="62" width="30" height="14" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="485" y1="40" x2="485" y2="60" stroke="var(--mina)" stroke-width="2" marker-end="url(#f22)"/>
    <text x="420" y="134" font-size="12">forza verso il basso,</text><text x="420" y="150" font-size="12">pezzo su legno di sacrificio</text>
  </g>
  <text x="20" y="184" font-size="12">regola comune: la forza di lavoro scarica sempre sul banco, mai sulla mano che tiene</text>
</svg>
<figcaption><b>Fig. 2.3</b> — Ogni gesto ha il suo modo di fermare il pezzo. Se devi tenerlo con la mano libera, il bloccaggio è sbagliato: prima o poi scivola, e in quel momento l'utensile è in movimento.</figcaption>
</figure>
