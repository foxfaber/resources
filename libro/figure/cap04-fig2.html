<figure>
<svg viewBox="0 0 600 210" role="img" aria-label="Sequenza delle grane: pietra grossa solo per riparare, media fino alla bava, fine per il microbisello e cuoio per rifinire, con i tempi indicativi.">
  <line x1="40" y1="140" x2="560" y2="140" stroke="currentColor" stroke-width="2"/>
  <g font-size="12">
    <rect x="40" y="96" width="110" height="44" fill="url(#h41)" stroke="currentColor" stroke-width="2"/>
    <text x="48" y="124">grana 400</text><text x="48" y="90">riparare</text><text x="48" y="162">solo con il filo</text><text x="48" y="178">scheggiato</text>
    <rect x="170" y="78" width="110" height="62" fill="url(#h41)" stroke="currentColor" stroke-width="2"/>
    <text x="178" y="116">grana 1000</text><text x="178" y="72">rifare il filo</text><text x="178" y="162">fino a sentire</text><text x="178" y="178">la bava: 2 min</text>
    <rect x="300" y="104" width="110" height="36" fill="var(--mina)" opacity=".3" stroke="var(--mina)" stroke-width="2"/>
    <text x="308" y="128">grana 6000</text><text x="308" y="98" fill="var(--mina)">microbisello</text><text x="308" y="162">10 passate</text><text x="308" y="178">a 30°</text>
    <rect x="430" y="118" width="110" height="22" fill="url(#h41)" stroke="currentColor" stroke-width="2"/>
    <text x="438" y="134">cuoio</text><text x="438" y="112">lucidare</text><text x="438" y="162">20 passate,</text><text x="438" y="178">dorso e bisello</text>
  </g>
  <text x="40" y="36" font-size="12">tempo speso per passaggio — la pietra grossa è l'eccezione, non la routine</text>
  <line x1="150" y1="56" x2="540" y2="56" stroke="var(--mina)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="152" y="50" font-size="12" fill="var(--mina)">manutenzione normale: da qui in poi, due minuti</text>
</svg>
<figcaption><b>Fig. 4.2</b> — L'altezza di ogni blocco è il tempo che vi si passa. Chi affila spesso vive negli ultimi due blocchi; chi affila di rado deve ricominciare ogni volta dalla grana grossa, e ci mette venti volte tanto.</figcaption>
</figure>
