  <path d="M40,116 L80,146 L280,146 L240,116" fill="url(#h31)" stroke="currentColor" stroke-width="2"/>
  <path d="M240,46 L280,76 L280,146 L240,116" fill="none" stroke="currentColor" stroke-width="2"/>

  <text x="42" y="36" font-size="12" fill="var(--mina)">faccia di riferimento: il ricciolo</text>

  <line x1="300" y1="60" x2="340" y2="60" stroke="currentColor" stroke-width="1" marker-end="url(#f31)"/>
  <g font-size="12">
    <text x="352" y="46">su ogni pezzo del telaio:</text>
    <text x="352" y="68">· una sola faccia marcata</text>
    <text x="352" y="88">· un solo filo marcato</text>
    <text x="352" y="108">· squadra e truschino appoggiano</text>
    <text x="364" y="126">sempre lì, mai sulle altre</text>
    <text x="352" y="152">le marcature restano fino</text>

  <text x="40" y="206" font-size="12">quattro pezzi, quattro riccioli rivolti verso l'interno del telaio: così il verso di montaggio non si perde</text>

<figcaption><b>Fig. 3.1</b> — Due segni per pezzo e tutto il resto discende da lì. È la convenzione più antica del mestiere e serve a una cosa sola: far sì che gli errori di spessore finiscano tutti sulla faccia nascosta.</figcaption>
